name: GLaDOS check-in

on:
  workflow_dispatch:
    inputs:
      domains:
        description: "签到域名，逗号分隔；留空使用仓库配置"
        type: string
        required: false
        default: ""
      exchange_plan:
        description: "手动验证默认关闭兑换"
        type: choice
        default: "off"
        options: ["off", "plan100", "plan200", "plan500"]
  push:
    branches: [master, main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "imgs/**"
  pull_request:
    branches: [master, main]
  schedule:
    # UTC 01:17 / 07:17，即北京时间 09:17 / 15:17。
    - cron: "17 1,7 * * *"

permissions:
  contents: read

concurrency:
  group: glados-checkin-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  checkin:
    name: Check in
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run check-in
        run: python checkin.py
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_DOMAINS: ${{ inputs.domains || vars.GLADOS_DOMAINS || 'glados.one' }}
          GLADOS_EXCHANGE_PLAN: ${{ github.event_name == 'workflow_dispatch' && inputs.exchange_plan || vars.GLADOS_EXCHANGE_PLAN || secrets.GLADOS_EXCHANGE_PLAN || 'off' }}
          GLADOS_VERBOSE: ${{ vars.GLADOS_VERBOSE || 'false' }}
          PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
